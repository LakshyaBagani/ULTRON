name: Installer integration

on:
  pull_request:
    paths:
      - 'scripts/install/**'
      - 'src/ultron/cli/**'
      - 'tests/install/**'
      - '.github/workflows/installer-integration.yml'
  schedule:
    - cron: '0 6 * * *'

jobs:
  container-matrix:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:22.04
          - ubuntu:24.04
          - fedora:40

    container: ${{ matrix.image }}

    steps:
      - name: Install prereqs (Ubuntu/Debian)
        if: contains(matrix.image, 'ubuntu') || contains(matrix.image, 'debian')
        run: |
          apt-get update
          apt-get install -y curl git python3 sudo

      - name: Install prereqs (Fedora)
        if: contains(matrix.image, 'fedora')
        run: |
          dnf install -y curl git python3 sudo

      - name: Create non-root user
        run: useradd -m -s /bin/bash testuser

      - uses: actions/checkout@v7
        with:
          path: ultron-src

      - name: Install Ollama mock
        run: install -m 755 "$GITHUB_WORKSPACE/ultron-src/tests/install/bash/stubs/ollama-mock" /usr/local/bin/ollama

      - name: Run installer
        run: |
          chown -R testuser:testuser /home/testuser "$GITHUB_WORKSPACE/ultron-src"
          su testuser -c '
            export ULTRON_REPO_URL=file://'"$GITHUB_WORKSPACE"'/ultron-src
            cd '"$GITHUB_WORKSPACE"'/ultron-src
            bash scripts/install/install.sh --no-bg-orchestrator
          '

      - name: Verify install state
        run: |
          su testuser -c '
            test -d ~/.ultron/src
            test -d ~/.ultron/.venv
            test -f ~/.ultron/config.toml
            test -f ~/.ultron/.state/install-state.json
            test -L ~/.local/bin/ultron
          '

      - name: Verify ultron --version
        run: su testuser -c '~/.local/bin/ultron --version'

      - name: Verify ultron doctor exits 0
        run: su testuser -c '~/.local/bin/ultron doctor'

      - name: Verify uninstall is clean
        run: |
          su testuser -c '
            ~/.local/bin/ultron-uninstall --yes
            test ! -d ~/.ultron
            test ! -L ~/.local/bin/ultron
          '

  macos:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]

    steps:
      - uses: actions/checkout@v7

      - name: Install Ollama mock
        run: sudo install -m 755 tests/install/bash/stubs/ollama-mock /usr/local/bin/ollama

      - name: Run installer
        run: |
          export ULTRON_REPO_URL=file://$(pwd)
          bash scripts/install/install.sh --no-bg-orchestrator

      - name: Verify install state
        run: |
          test -d ~/.ultron/src
          test -d ~/.ultron/.venv
          test -f ~/.ultron/config.toml
          test -L ~/.local/bin/ultron

      - name: Verify ultron --version
        run: ~/.local/bin/ultron --version

      - name: Verify ultron doctor exits 0
        run: ~/.local/bin/ultron doctor

      - name: Verify uninstall is clean
        run: |
          ~/.local/bin/ultron-uninstall --yes
          test ! -d ~/.ultron
          test ! -L ~/.local/bin/ultron
